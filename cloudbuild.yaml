steps:

  # 1. Pruebas unitarias con pytest
  - name: 'python:3.11'
    entrypoint: bash
    args: ['-c', 'pip install -r requirements.txt && pytest -v']

  # 2. Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/mi-app/imagen:$COMMIT_SHA', '.']

  # 3. Push a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/mi-app/imagen:$COMMIT_SHA']

  # 4. Deploy en Cloud Run (sin downtime)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - mi-app
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/mi-app/imagen:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/mi-app/imagen:$COMMIT_SHA'